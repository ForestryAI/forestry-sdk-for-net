# Orchestrator: decides when CI runs and for which packages, then calls the phases
# (contract eng/specs/001-ci-cd/contracts/ci-workflow.md, map in eng/README.md).
# One job per package and phase, so a package's failure shows on its own job only (R7).
# Adding a package to CI = one entry in build-test, one in performance if it has performance tests,
# and one in pack if it is released (FR-015).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run. On main a running run finishes, but GitHub
  # keeps only one waiting: quick successive merges replace the waiting run, and the latest commit runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: Forestry.Xml
            slnx: sdk/xml/Forestry.Xml/Forestry.Xml.slnx
          - package: Forestry.Serialization
            slnx: sdk/serialization/Forestry.Serialization/Forestry.Serialization.slnx
          - package: Forestry.Serialization.Xml
            slnx: sdk/serialization/Forestry.Serialization.Xml/Forestry.Serialization.Xml.slnx
          - package: Forestry.StanForD
            slnx: sdk/stanford/Forestry.StanForD/Forestry.StanForD.slnx
          # Checked but not released in spec 001: they share the central package versions (FR-015)
          - package: Forestry.Raindrop
            slnx: sdk/raindrop/Forestry.Raindrop/Forestry.Raindrop.slnx
          - package: Forestry.Core
            slnx: sdk/core/Forestry.Core/Forestry.Core.slnx
    uses: ./.github/workflows/build-test.yml
    with:
      package: ${{ matrix.package }}
      slnx: ${{ matrix.slnx }}

  # Packed apart from build-test, so one package's failure never hides another's package
  pack:
    name: pack (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: Forestry.Xml
            slnx: sdk/xml/Forestry.Xml/Forestry.Xml.slnx
          - package: Forestry.Serialization
            slnx: sdk/serialization/Forestry.Serialization/Forestry.Serialization.slnx
          - package: Forestry.Serialization.Xml
            slnx: sdk/serialization/Forestry.Serialization.Xml/Forestry.Serialization.Xml.slnx
    uses: ./.github/workflows/pack.yml
    with:
      package: ${{ matrix.package }}
      slnx: ${{ matrix.slnx }}

  performance:
    name: performance (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: Forestry.Xml
            test-folder: sdk/xml/Forestry.Xml/test
            test-project: sdk/xml/Forestry.Xml/test/Forestry.Xml.Tests.csproj
          - package: Forestry.Serialization
            test-folder: sdk/serialization/Forestry.Serialization/test
            test-project: sdk/serialization/Forestry.Serialization/test/Forestry.Serialization.Tests.csproj
          - package: Forestry.Serialization.Xml
            test-folder: sdk/serialization/Forestry.Serialization.Xml/test
            test-project: sdk/serialization/Forestry.Serialization.Xml/test/Forestry.Serialization.Xml.Tests.csproj
    uses: ./.github/workflows/performance.yml
    with:
      package: ${{ matrix.package }}
      test-project: ${{ matrix.test-project }}
      test-folder: ${{ matrix.test-folder }}
