# Dependency updates as reviewed pull requests (eng constitution S1; research "Dependabot notes").
# Security alerts and security updates are separate repository settings (Settings → Security).
version: 2
updates:
  - package-ecosystem: nuget
    # Dependabot looks for a solution or project in each listed folder and does not search below it,
    # so point it at the package folders (each holds a .slnx). Versions stay in eng/packaging/ (R9).
    directories:
      - /sdk/*/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-packages:
        patterns:
          - Microsoft.NET.Test.Sdk
          - xunit*
          - coverlet.*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
    ignore:
      # A library's dependency is its consumers' minimum: stay on the supported framework's line (note 4)
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: System.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    # / covers .github/workflows/; a composite action's folder has to be listed itself (they live in eng/actions/)
    directories:
      - /
      - /eng/actions/setup
      - /eng/actions/baseline
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
