# Steps every phase repeats (the GitHub equivalent of an Azure DevOps step template).
# Local equivalent: install the .NET SDK named in global.json (`dotnet --version` matches it).
name: Setup .NET
description: Installs the .NET SDK pinned in global.json and restores the NuGet package cache.

runs:
  using: composite
  steps:
    - name: Setup .NET from global.json
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('eng/packaging/*.props', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-
